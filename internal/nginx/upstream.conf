# Reverse-proxy snippet - paste into your existing nginx server block, or use
# as inspiration for caddy/traefik. The Huly docker stack is expected to be on
# a docker network accessible to your proxy; on the standard `huly_net` bridge
# the service hostnames below resolve directly.
#
# Make sure to:
#   1. Replace `your.host.example` with your real public hostname.
#   2. Add ssl_certificate + ssl_certificate_key directives if SECURE=true.
#   3. Allow websocket Upgrade / Connection headers (see the _transactor and
#      _collaborator locations).
#   4. Allow large bodies (client_max_body_size 100M;) for file uploads.

upstream huly_front       { server front:8080; }
upstream huly_account     { server account:3000; }
upstream huly_transactor  { server transactor:3333; }
upstream huly_collaborator{ server collaborator:3078; }
upstream huly_rekoni      { server rekoni:4004; }
upstream huly_stats       { server stats:4900; }
upstream huly_files       { server minio:9000; }

server {
    listen ${LISTEN_DIRECTIVE};
    server_name your.host.example;
    client_max_body_size 100M;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://huly_front;
    }

    location /_accounts/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://huly_account/;
    }

    location /_collaborator/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://huly_collaborator/;
    }

    location /_transactor/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://huly_transactor/;
    }

    location ~ ^/eyJ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://huly_transactor;
    }

    location /_rekoni/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://huly_rekoni/;
    }

    location /_stats/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://huly_stats/;
    }

    location /files/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://huly_files/;
    }
}
